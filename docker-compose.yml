# Pinned so the project (and the labels on its volume) doesn't depend on the folder name;
# the data volume was created when this file lived in distributed_crm/.
name: distributed_crm

services:
  postgres:
    image: postgres:17
    container_name: distributed-crm-postgres
    environment:
      POSTGRES_DB: distributed_crm
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - distributed-crm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../distributed_crm_be
      target: migrate # the psql + migrate.sql stage, not the API image
    container_name: distributed-crm-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: distributed_crm
      PGUSER: postgres
      PGPASSWORD: devpassword

  redis:
    image: redis:7
    container_name: distributed-crm-redis
    # A password, so local dev signs in like Azure does: the apps use a password when the connection string has one
    # and a managed-identity token when it doesn't.
    command: ["redis-server", "--requirepass", "devpassword"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devpassword", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  servicebus-sql:
    image: mcr.microsoft.com/azure-sql-edge:1.0.7 # the emulator's private storage - our apps never connect to it
    container_name: distributed-crm-servicebus-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevPassword-123!"
    # no ports: only the emulator talks to it, over the Compose network

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    container_name: distributed-crm-servicebus
    depends_on:
      - servicebus-sql
    volumes:
      - ./servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "127.0.0.1:5672:5672" # AMQP
      - "127.0.0.1:5300:5300" # management + health
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: "DevPassword-123!"
      ACCEPT_EULA: "Y"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
    container_name: distributed-crm-aspire-dashboard
    ports:
      - "127.0.0.1:18888:18888" # UI
      - "127.0.0.1:4317:18889" # OTLP gRPC, on the standard port so `dotnet run` finds it with no config
    environment:
      # Local only and bound to 127.0.0.1, so skip the login token and OTLP API key.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  be:
    build: ../distributed_crm_be
    container_name: distributed-crm-be
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      servicebus:
        condition: service_started # the emulator image has no shell for a healthcheck; the SDK retries until it's up
    ports:
      - "127.0.0.1:5214:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DistributedCrm: "Host=postgres;Port=5432;Database=distributed_crm;Username=postgres;Password=devpassword;Gss Encryption Mode=Disable"
      ConnectionStrings__Redis: "redis:6379,password=devpassword"
      ConnectionStrings__ServiceBus: "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GoogleAuth__AllowedEmails__0: ${ALLOWED_EMAIL:?set ALLOWED_EMAIL in .env}

  worker:
    build: ../distributed_crm_worker
    container_name: distributed-crm-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      servicebus:
        condition: service_started # the emulator image has no shell for a healthcheck; the SDK retries until it's up
    ports:
      - "127.0.0.1:5216:8080" # health endpoints only
    environment:
      ConnectionStrings__DistributedCrm: "Host=postgres;Port=5432;Database=distributed_crm;Username=postgres;Password=devpassword;Gss Encryption Mode=Disable"
      ConnectionStrings__Redis: "redis:6379,password=devpassword"
      ConnectionStrings__ServiceBus: "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"

volumes:
  distributed-crm-pgdata:
    name: distributed_crm_distributed-crm-pgdata

